function ic(n, filled) {
  var d = P[n] || "";
  var paths = d.split(" M").map(function (s, i) { return '<path d="' + (i ? "M" : "") + s + '"/>'; }).join("");
  return '<svg class="pdl-ic" viewBox="0 0 24 24" fill="' + (filled ? "currentColor" : "none") + '" stroke="currentColor" stroke-width="' + (filled ? 1 : 2) + '" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + paths + "</svg>";
}

var BLOB = '<svg class="pdl-blob %c" viewBox="-100 -100 200 200" aria-hidden="true"><path d="M39.7,-58.8C51.9,-50.1,62.4,-38.9,68.6,-25.4C74.8,-11.9,76.7,3.8,72.3,17.7C67.9,31.6,57.3,43.7,44.6,52.8C31.9,61.9,17.2,68,1.6,66C-14,64,-28.1,53.9,-40.9,43.2C-53.7,32.5,-65.2,21.2,-69.6,7.2C-74,-6.8,-71.3,-23.5,-62.2,-35.1C-53.1,-46.7,-37.6,-53.3,-23.4,-60.6C-9.2,-67.9,3.7,-75.9,16.9,-74.3C30.1,-72.7,27.5,-67.5,39.7,-58.8Z"/></svg>';
function blob(c) { return BLOB.replace("%c", c); }

function placeholder() {
  var C = CONFIG.colors;
  var svg = '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="' + C.primarySoft + '"/><stop offset="1" stop-color="' + C.backgroundAlt + '"/></linearGradient></defs><rect width="800" height="600" fill="url(#g)"/><g fill="none" stroke="' + C.primary + '" stroke-width="10" stroke-linecap="round" stroke-linejoin="round" opacity=".5"><rect x="300" y="240" width="200" height="130" rx="18"/><circle cx="400" cy="305" r="36"/></g></svg>';
  return "data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg);
}

function im(src, alt, cls) {
  return '<img' + (cls ? ' class="' + cls + '"' : "") + ' src="' + src + '" alt="' + (alt || "").replace(/"/g, "&quot;") + '" loading="lazy" decoding="async">';
}
function btn(text, go, cls, icon) {
  return '<a href="#' + go + '" data-go="' + go + '" class="pdl-btn ' + (cls || "") + '">' + text + (icon ? ic(icon) : "") + "</a>";
}
function head(title, sub, center) {
  return '<div class="pdl-head' + (center ? " c" : "") + '" data-rv><h2 class="pdl-h2">' + title + "</h2>" + (sub ? '<p class="pdl-sub">' + sub + "</p>" : "") + "</div>";
}
function carCtl(extra) {
  return '<div class="pdl-ctl"><button class="pdl-arr pdl-prev" type="button" aria-label="Назад">' + ic("arrowL") + '</button><button class="pdl-arr pdl-next" type="button" aria-label="Далі">' + ic("arrow") + '</button><span class="pdl-count pdl-cnt"></span>' + (extra || "") + "</div>";
}
function tgUrl(text) { return "https://t.me/" + CONFIG.brand.telegramUser + (text ? "?text=" + encodeURIComponent(text) : ""); }
function waUrl(text) { return "https://wa.me/" + CONFIG.brand.whatsappNumber + (text ? "?text=" + encodeURIComponent(text) : ""); }

/* ---------- ВЕРСТКА СЕКЦІЙ ---------- */
function buildHeader() {
  var B = CONFIG.brand;
  var logo = B.logo || window.__PDL_LOGO;
  var nav = CONFIG.nav.map(function (n) { return '<a href="#' + n.go + '" data-go="' + n.go + '">' + n.t + "</a>"; }).join("");
  var mnav = CONFIG.nav.map(function (n) { return '<a class="pdl-ml" href="#' + n.go + '" data-go="' + n.go + '">' + n.t + "</a>"; }).join("");
  var soc = '<a href="' + tgUrl() + '" target="_blank" rel="noopener" aria-label="Telegram">' + ic("send") + '</a><a href="' + B.viberUrl + '" aria-label="Viber">' + ic("phone") + '</a><a href="' + waUrl() + '" target="_blank" rel="noopener" aria-label="WhatsApp">' + ic("chat") + '</a><a href="' + B.instagramUrl + '" target="_blank" rel="noopener" aria-label="Instagram">' + ic("insta") + "</a>";
  return '<header class="pdl-hd" id="pdl-hd"><div class="pdl-wrap pdl-hd-in">' +
    '<a class="pdl-logo" href="#pdl-top" data-go="pdl-top" aria-label="' + B.name + '"><img src="' + logo + '" alt="' + B.name + '">' + (B.showNameNearLogo ? "<span>" + B.name.replace(" with ", "<br>with ") + "</span>" : "") + "</a>" +
    '<nav class="pdl-nav">' + nav + "</nav>" +
    '<div class="pdl-hd-r"><div class="pdl-soc">' + soc + '</div><a class="pdl-phone" href="tel:' + B.phoneHref + '">' + B.phone + '</a><button class="pdl-ib pdl-burger" id="pdl-bg" type="button" aria-label="Menu">' + ic("menu") + "</button></div>" +
    '</div></header><div class="pdl-mm" id="pdl-mm">' + mnav + '<div style="margin-top:20px"><a href="#pdl-order" data-go="pdl-order" class="pdl-btn" style="width:100%">' + CONFIG.headerButton + '</a></div><div class="pdl-soc">' + soc + '</div></div><div class="pdl-spacer"></div>';
}

function buildHero() {
  var H = CONFIG.hero;
  var imgs = H.images.map(function (s, i) { return im(s, "", i === 0 ? "on" : ""); }).join("");
  var stats = H.stats.map(function (s) { return '<div class="pdl-stat"><b data-count="' + s.value + '" data-pre="' + s.prefix + '" data-suf="' + s.suffix + '">' + s.prefix + s.value + s.suffix + "</b><span>" + s.label + "</span></div>"; }).join("");
  var adv = H.advantages.map(function (a, i) { return '<div class="pdl-advc" data-rv data-d="' + (i * 120) + '"><div class="ib">' + ic(a.icon) + "</div><b>" + a.t + '</b><span class="n">' + pad(i + 1) + "</span></div>"; }).join("");
  return '<section class="pdl-sec pdl-hero" id="pdl-top">' + blob("b1") + blob("b2") +
    '<div class="pdl-wrap pdl-hero-in"><div data-rv="l"><span class="pdl-tag">' + ic("heart", true) + H.tag + '</span><h1 class="pdl-h1">' + H.title + '</h1><p class="pdl-lead">' + H.text + '</p>' +
    '<div class="pdl-row">' + btn(H.btn1, H.btn1Go, "", "arrow") + btn(H.btn2, H.btn2Go, "pdl-btn-o") + '</div><div class="pdl-stats">' + stats + "</div></div>" +
    '<div class="pdl-hero-v" data-rv="r"><div class="pdl-ring"></div><div class="pdl-bimg" id="pdl-hs">' + imgs + '</div>' +
    '<div class="pdl-float f1">' + ic("shield") + H.float1 + '</div><div class="pdl-float f2">' + ic("truck") + H.float2 + '</div>' +
    '<div class="pdl-hero-ctl"><button class="pdl-arr" id="pdl-hp" type="button" aria-label="Назад">' + ic("arrowL") + '</button><button class="pdl-arr" id="pdl-hn" type="button" aria-label="Далі">' + ic("arrow") + '</button><span class="pdl-count" id="pdl-hc"></span></div></div></div>' +
    '<div class="pdl-wrap pdl-adv">' + adv + "</div></section>";
}

function buildPicker() {
  var K = CONFIG.picker;
  var tabs = K.products.map(function (p, i) { return '<button type="button" class="pdl-tab' + (i === 0 ? " on" : "") + '" data-p="' + i + '">' + p.tab + "</button>"; }).join("");
  var fills = K.fillModes.map(function (f, i) { return '<button type="button" class="pdl-fb' + (i === 0 ? " on" : "") + '" data-f="' + f.id + '">' + f.t + "</button>"; }).join("");
  var how = K.how.map(function (h, i) { return "<li><i>" + (i + 1) + "</i><span>" + h + "</span></li>"; }).join("");
  return '<section class="pdl-sec pdl-pk" id="pdl-picker">' + blob("b1") + blob("b3") + '<div class="pdl-wrap">' + head(K.title, K.subtitle) +
    '<div class="pdl-pk-grid">' +
    '<div class="pk-v" data-rv><div class="pdl-glass pdl-pk-view"><div class="pdl-tabs">' + tabs + "</div>" +
    '<div class="pdl-stage" id="pdl-stage"><div class="pdl-fw" id="pdl-fw"><div class="pdl-kring"></div><div class="pdl-frame t-canvas" id="pdl-frame"><div class="pdl-fbg blur" id="pdl-fbg"></div><img class="pdl-fimg" id="pdl-fimg" alt=""></div></div></div>' +
    '<div class="pdl-dim" id="pdl-dim"></div><p class="pdl-pk-note" id="pdl-note"></p>' +
    '<div class="pdl-fill"><span>' + K.fillLabel + "</span>" + fills + "</div>" +
    '<div class="pdl-rec">' + ic("star", true) + "<span>- " + K.bestLegend + "</span></div>" +
    '<div class="pdl-chips" id="pdl-chips"></div><div class="pdl-qual" id="pdl-qual"></div>' +
    '<button type="button" class="pdl-link pdl-reset" id="pdl-reset">' + ic("refresh") + K.changeBtn + "</button></div></div>" +
    '<div class="pdl-glass pdl-sumbar pk-sum" data-rv="r"><div><div class="nm" id="pdl-snm"></div><div class="pr" id="pdl-spr"></div></div><button type="button" class="pdl-btn" id="pdl-sord">' + K.orderBtn + "</button></div>" +
    '<aside class="pdl-pk-side pk-s" data-rv="r"><div class="pdl-glass pdl-drop" id="pdl-drop"><div class="ui">' + ic("upload") + "</div><h3>" + K.uploadTitle + "</h3><p>" + K.uploadText + '</p><button type="button" class="pdl-btn" id="pdl-up">' + K.uploadBtn + '</button><input type="file" id="pdl-file" accept="image/jpeg,image/png,image/webp,image/bmp,image/avif,.jpg,.jpeg,.png,.webp,.bmp,.avif" style="display:none"><div class="pdl-err" id="pdl-err" role="alert"></div><div class="pdl-fmt">' + K.formatsText + "</div></div>" +
    '<div class="pdl-fi" id="pdl-fi">' + ic("check") + '<div><b id="pdl-fn"></b><span id="pdl-fd"></span></div></div>' +
    '<div class="pdl-glass pdl-how"><ul>' + how + "</ul></div></aside></div></div></section>";
}

function buildExtra(X) {
  if (!X || X.enabled === false) { return ""; }
  var rows = X.items.map(function (it, i) {
    return '<div class="pdl-xr" role="button" tabindex="0" data-i="' + i + '"><span class="n">' + pad(i + 1) + '</span><div class="m"><div class="t">' + it.t + '</div><div class="d">' + it.d + '</div></div><span class="l"></span><span class="p">' + it.price + "</span></div>";
  }).join("");
  var ph = X.items.map(function (it, i) { return '<figure class="pdl-xp" data-i="' + i + '">' + im(it.img, it.t).replace('loading="lazy"', 'loading="eager"') + "<i>" + it.t + "</i></figure>"; }).join("");
  return '<div class="pdl-x" id="pdl-extra" data-rv><div class="pdl-x-l"><span class="pdl-x-k">' + X.badge + '</span><h3 class="pdl-h2">' + X.title + '</h3><p class="pdl-x-s">' + X.subtitle + '</p><div class="pdl-x-list">' + rows + '</div><div class="pdl-x-f"><a href="#" data-go="pdl-order" data-prod="" id="pdl-xo" class="pdl-btn pdl-btn-w">' + X.btn + ic("arrow") + '</a><span class="pdl-x-note">' + X.note + '</span></div></div><div class="pdl-x-r" id="pdl-xs">' + ph + "</div></div>";
}

function buildCatalog() {
  var C = CONFIG.catalog;
  var items = C.items.map(function (c, i) {
    return '<div class="pdl-slide"><div class="pdl-card"><div class="im">' + im(c.img, c.t) + '</div><div class="bd"><h3>' + c.t + "</h3><p>" + c.d + '</p><div class="pr">' + c.price + '</div><a href="#" data-pick="' + c.pick + '" data-go="' + (c.pick ? "pdl-picker" : "pdl-order") + '" data-prod="' + c.t.replace(/"/g, "") + '" class="pdl-btn pdl-btn-o pdl-btn-s">' + c.btn + "</a></div></div></div>";
  }).join("");
  return '<section class="pdl-sec" id="pdl-catalog"><div class="pdl-wrap">' + head(C.title, C.subtitle) + '<div class="pdl-car" id="pdl-car1" data-rv><div class="pdl-track">' + items + "</div>" + carCtl() + "</div>" + buildExtra(C.extra) + "</div></section>";
}

function buildCheck() {
  var C = CONFIG.check;
  var pts = C.points.map(function (p) { return "<li><i>" + ic("check") + "</i><span>" + p + "</span></li>"; }).join("");
  return '<section class="pdl-sec pdl-alt" id="pdl-check">' + blob("b2") + '<div class="pdl-wrap pdl-chk"><div class="pdl-chk-img" data-rv="l">' + im(C.img, "") + '<div class="bdg">' + ic("shield") + C.badge + '</div></div><div data-rv="r"><p class="pdl-kick">' + C.lead + '</p><h2 class="pdl-h2">' + C.title + '</h2><p class="pdl-sub">' + C.text + "</p><ul>" + pts + '</ul><a href="#" data-go="pdl-order" data-prod="Перевірка фото" class="pdl-btn">' + C.btn + ic("arrow") + "</a></div></div></section>";
}

function buildWorks() {
  var W = CONFIG.works;
  var tabs = W.tabs.map(function (t, i) { return '<button type="button" class="pdl-tab' + (i === 0 ? " on" : "") + '" data-c="' + t.id + '">' + t.t + "</button>"; }).join("");
  var items = W.items.map(function (w) { return '<div class="pdl-slide" data-cat="' + w.cat + '"><div class="pdl-wk">' + im(w.img, w.t) + "<span>" + w.t + "</span></div></div>"; }).join("");
  return '<section class="pdl-sec" id="pdl-works"><div class="pdl-wrap">' + head(W.title, W.subtitle) + '<div class="pdl-ftabs" data-rv>' + tabs + '</div><div class="pdl-car" id="pdl-car2" data-rv><div class="pdl-track">' + items + "</div>" + carCtl() + "</div></div></section>";
}

function buildBA() {
  var B = CONFIG.beforeAfter;
  var items = B.items.map(function (it) {
    var demo = !it.after;
    if (B.mode !== "slider") {
      var aft = it.after || it.before;
      return '<div class="pdl-ba-w" data-rv><h3>' + it.t + '</h3><div class="pdl-bs-row"><figure class="pdl-bs-f" style="--u:url(\'' + it.before + '\')"><img src="' + it.before + '" alt=""' + (demo ? ' style="filter:' + B.filterBefore + '"' : "") + '><span class="lb">' + B.labelBefore + '</span></figure><span class="pdl-bs-ar">' + ic("arrow") + '</span><figure class="pdl-bs-f" style="--u:url(\'' + aft + '\')"><img src="' + aft + '" alt=""' + (demo ? ' style="filter:' + B.filterAfter + '"' : "") + '><span class="lb b">' + B.labelAfter + "</span></figure></div></div>";
    }
    return '<div class="pdl-ba-w" data-rv><h3>' + it.t + '</h3><div class="pdl-ba"><img src="' + (it.after || it.before) + '" alt=""' + (demo ? ' style="filter:' + B.filterAfter + '"' : "") + '><div class="bf"><img src="' + it.before + '" alt=""' + (demo ? ' style="filter:' + B.filterBefore + '"' : "") + '></div><span class="lb a">' + B.labelBefore + '</span><span class="lb b">' + B.labelAfter + '</span><div class="hl"></div><input type="range" min="0" max="100" value="50" aria-label="' + B.hint + '"></div><p class="pdl-fnote" style="margin-top:10px">' + B.hint + "</p></div>";
  }).join("");
  return '<section class="pdl-sec pdl-alt" id="pdl-ba">' + blob("b3") + '<div class="pdl-wrap">' + head(B.title, B.subtitle) + '<div class="pdl-ba-grid">' + items + "</div></div></section>";
}

function buildQuality() {
  var Q = CONFIG.quality;
  var items = Q.items.map(function (q, i) { return '<div class="pdl-q" data-rv data-d="' + ((i % 3) * 120) + '"><span class="nb">' + pad(i + 1) + '</span><div class="im">' + im(q.img, q.t) + "</div><h3>" + q.t + "</h3><p>" + q.d + "</p></div>"; }).join("");
  return '<section class="pdl-sec" id="pdl-quality"><div class="pdl-wrap">' + head(Q.title, Q.subtitle) + '<div class="pdl-q-grid">' + items + "</div></div></section>";
}

function buildGifts() {
  var G = CONFIG.gifts;
  var items = G.items.map(function (g, i) { return '<a href="#" data-go="pdl-order" data-prod="' + g.t.replace(/"/g, "") + '" class="pdl-gift" data-rv data-d="' + (i * 120) + '">' + im(g.img, g.t) + '<div class="tx"><h3>' + g.t + "</h3><p>" + g.d + "</p></div></a>"; }).join("");
  return '<section class="pdl-sec pdl-alt" id="pdl-gifts">' + blob("b1") + '<div class="pdl-wrap">' + head(G.title, G.subtitle) + '<div class="pdl-g3">' + items + '</div><div class="pdl-row" style="justify-content:center" data-rv>' + btn(G.btn, "pdl-order", "", "gift") + "</div></div></section>";
}

function buildSteps() {
  var S = CONFIG.steps;
  var items = S.items.map(function (s, i) { return '<div class="pdl-step" data-rv data-d="' + (i * 120) + '"><div class="no">' + (i + 1) + "</div><h3>" + s.t + "</h3><p>" + s.d + "</p></div>"; }).join("");
  return '<section class="pdl-sec" id="pdl-steps"><div class="pdl-wrap">' + head(S.title, "", true) + '<div class="pdl-steps">' + items + "</div></div></section>";
}

function buildReviews() {
  var R = CONFIG.reviews;
  var stars = ""; for (var i = 0; i < 5; i++) { stars += ic("star", true); }
  var moreUrl = R.moreUrl || CONFIG.brand.instagramUrl;
  var more = R.moreText ? '<div class="pdl-rvmore"><span>' + R.moreText + '</span> <a href="' + moreUrl + '" target="_blank" rel="noopener">' + ic("insta") + (R.moreLinkText || CONFIG.brand.instagramHandle) + "</a></div>" : "";
  var items = R.items.map(function (r) {
    return '<div class="pdl-rv pdl-slide"><div class="pdl-rvc' + (r.img ? " has-i" : "") + '">' + (r.img ? '<div class="pdl-rvi">' + im(r.img, r.name) + "</div>" : "") + '<div class="pdl-rvh"><div class="pdl-av">' + (r.photo ? im(r.photo, r.name) : r.name.charAt(0)) + "</div><div><b>" + r.name + "</b><span>" + r.city + '</span></div></div><div class="pdl-stars">' + stars + "</div><p>" + r.text + "</p></div></div>";
  }).join("");
  return '<section class="pdl-sec pdl-alt" id="pdl-reviews">' + blob("b2") + '<div class="pdl-wrap">' + head(R.title, "") + '<div class="pdl-car" id="pdl-car3" data-rv><div class="pdl-track">' + items + "</div>" + carCtl(more) + "</div></div></section>";
}

function buildDelivery() {

/* ---------- ІНТЕРАКТИВНИЙ ПІДБІР ---------- */
function initPicker() {
  var K = CONFIG.picker, prods = K.products;
  var stage = $("#pdl-stage"), fw = $("#pdl-fw"), frame = $("#pdl-frame"), fbg = $("#pdl-fbg"), fimg = $("#pdl-fimg");
  var dim = $("#pdl-dim"), note = $("#pdl-note"), chips = $("#pdl-chips"), qual = $("#pdl-qual");
  var snm = $("#pdl-snm"), spr = $("#pdl-spr"), fileIn = $("#pdl-file"), drop = $("#pdl-drop"), err = $("#pdl-err");
  var fi = $("#pdl-fi"), fn = $("#pdl-fn"), fd = $("#pdl-fd"), reset = $("#pdl-reset");
  var tabs = $$("#pdl-picker .pdl-tab"), fbs = $$("#pdl-picker .pdl-fb");
  var cur = 0, sel = 0, fill = K.fillModes[0].id;
  var photo = { url: K.sample, w: K.sampleW, h: K.sampleH, sample: true, name: "", file: null };

  function fmt(s) { return s[0] + "\u00D7" + s[1] + " " + K.unit; }

  function analyze(prod) {
    var r = photo.w / photo.h, land = r >= 1, rho = land ? r : 1 / r, out = [];
    prod.sizes.forEach(function (s, i) {
      var sh = s[0], lg = s[1], fwc = land ? lg : sh, fhc = land ? sh : lg;
      var diff = Math.abs(Math.log(rho / (lg / sh)));
      var scale = Math.min(fwc / photo.w, fhc / photo.h);
      var dpi = 2.54 / scale, q = "good", pen = 0;
      if (!photo.sample) {
        if (dpi >= prod.dpiGood) { q = "good"; pen = 0; }
        else if (dpi >= prod.dpiMin) { q = "mid"; pen = 0.25 * (prod.dpiGood - dpi) / (prod.dpiGood - prod.dpiMin); }
        else { q = "low"; pen = 0.6 + 0.6 * (prod.dpiMin - dpi) / prod.dpiMin; }
      }
      out.push({ i: i, fw: fwc, fh: fhc, dpi: dpi, q: q, score: diff * 2 + pen });
    });
    return out;
  }
  function bestOf(an) {
    var b = 0;
    an.forEach(function (a, i) { if (a.score < an[b].score - 1e-9) { b = i; } });
    return b;
  }
  function setAuto() { sel = bestOf(analyze(prods[cur])); }

  function render() {
    var prod = prods[cur], an = analyze(prod), best = bestOf(an);
    if (sel >= prod.sizes.length) { sel = best; }
    var a = an[sel], s = prod.sizes[sel];

    /* розмір рамки */
    var sw = stage.clientWidth || 320, maxH = window.innerWidth < 640 ? 220 : 300;
    var ratio = a.fw / a.fh;
    var w = Math.min(sw - 60, maxH * ratio), h = w / ratio;
    var maxA = 0; prod.sizes.forEach(function (z) { maxA = Math.max(maxA, z[0] * z[1]); });
    var k = 0.62 + 0.38 * Math.sqrt((s[0] * s[1]) / maxA);
    frame.style.width = Math.round(w * k) + "px";
    frame.style.height = Math.round(h * k) + "px";
    frame.className = "pdl-frame t-" + prod.type;
    fw.className = "pdl-fw" + (prod.type === "keychain" ? " key" : "");

    /* фон і фото: фото завжди повністю видно (contain) */
    if (fimg.getAttribute("src") !== photo.url) { fimg.setAttribute("src", photo.url); }
    if (fill === "blur") { fbg.className = "pdl-fbg blur"; fbg.style.backgroundImage = 'url("' + photo.url + '")'; fbg.style.backgroundColor = "transparent"; }
    else { fbg.className = "pdl-fbg"; fbg.style.backgroundImage = "none"; fbg.style.backgroundColor = fill === "white" ? "#FFFFFF" : "#111111"; }

    dim.textContent = fmt(s);
    note.textContent = photo.sample ? K.sampleNote : K.userNote;

    /* чіпи */
    var html = "";
    prod.sizes.forEach(function (z, i) {
      var c = "pdl-chip" + (i === sel ? " is-sel" : "") + (i === best ? " is-best" : "") + (an[i].q === "low" ? " is-low" : "");
      html += '<button type="button" class="' + c + '" data-i="' + i + '"><span class="l">' + (i === best ? ic("star", true) : "") + fmt(z) + '</span><span class="pp">' + z[2] + K.currency + "</span></button>";
    });
    chips.innerHTML = html;

    /* якість */
    if (photo.sample) { qual.className = "pdl-qual"; qual.textContent = ""; }
    else {
      qual.className = "pdl-qual " + a.q;
      qual.textContent = a.q === "good" ? K.qualGood : (a.q === "mid" ? K.qualMid : K.qualLow);
    }

    snm.textContent = prod.name + " " + fmt(s);
    var newP = s[2] + " " + K.currency;
    if (spr.textContent !== newP) { spr.textContent = newP; spr.classList.add("bump"); setTimeout(function () { spr.classList.remove("bump"); }, 250); }
    reset.classList.toggle("on", !photo.sample);
  }

  tabs.forEach(function (b) {
    b.addEventListener("click", function () { selectProduct(parseInt(b.getAttribute("data-p"), 10)); });
  });
  function selectProduct(i) {
    cur = i;
    tabs.forEach(function (x, k) { x.classList.toggle("on", k === i); });
    setAuto();
    frame.style.animation = "none"; void frame.offsetWidth; frame.style.animation = "";
    render();
  }
  API.pickProduct = function (id) {
    for (var i = 0; i < prods.length; i++) { if (prods[i].id === id) { selectProduct(i); return; } }
  };

  chips.addEventListener("click", function (e) {
    var b = e.target.closest ? e.target.closest(".pdl-chip") : null;
    if (!b) { return; }
    sel = parseInt(b.getAttribute("data-i"), 10);
    render();
  });
  fbs.forEach(function (b) {
    b.addEventListener("click", function () {
      fill = b.getAttribute("data-f");
      fbs.forEach(function (x) { x.classList.toggle("on", x === b); });
      render();
    });
  });

  function showErr(t) { err.textContent = t; }
  function handleFile(f) {
    showErr("");
    if (!f) { return; }
    var ext = (f.name.split(".").pop() || "").toLowerCase();
    var okExt = K.allowedExt.indexOf(ext) > -1;
    var okMime = /^image\/(jpeg|png|webp|bmp|avif)$/.test(f.type);
    if (!okExt && !okMime) { showErr(K.errFormat); return; }
    if (f.size > K.maxFileMB * 1048576) { showErr(K.errSize); return; }
    var url = URL.createObjectURL(f), img = new Image();
    img.onload = function () {
      if (!photo.sample && photo.url) { try { URL.revokeObjectURL(photo.url); } catch (x) {} }
      photo = { url: url, w: img.naturalWidth, h: img.naturalHeight, sample: false, name: f.name, file: f };
      window.__PDL_PHOTO = f;
      fn.textContent = f.name;
      fd.textContent = img.naturalWidth + " \u00D7 " + img.naturalHeight + " px, " + (f.size / 1048576).toFixed(1) + " MB";
      fi.classList.add("on");
      setAuto();
      frame.style.animation = "none"; void frame.offsetWidth; frame.style.animation = "";
      render();
    };
    img.onerror = function () { showErr(K.errRead); try { URL.revokeObjectURL(url); } catch (x) {} };
    img.src = url;
  }
  $("#pdl-up").addEventListener("click", function (e) { e.stopPropagation(); fileIn.click(); });
  drop.addEventListener("click", function (e) { if (e.target === drop || e.target.closest(".ui") || e.target.tagName === "H3" || e.target.tagName === "P") { fileIn.click(); } });
  reset.addEventListener("click", function () { fileIn.click(); });
  fileIn.addEventListener("change", function () { handleFile(fileIn.files && fileIn.files[0]); fileIn.value = ""; });
  ["dragenter", "dragover"].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.add("drag"); }); });
  ["dragleave", "drop"].forEach(function (ev) { drop.addEventListener(ev, function (e) { e.preventDefault(); drop.classList.remove("drag"); }); });
  drop.addEventListener("drop", function (e) { var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; handleFile(f); });
  stage.addEventListener("dragover", function (e) { e.preventDefault(); });
  stage.addEventListener("drop", function (e) { e.preventDefault(); var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0]; handleFile(f); });

  $("#pdl-sord").addEventListener("click", function () {
    var prod = prods[cur], s = prod.sizes[sel];
    API.setOrder({ text: prod.name + " " + fmt(s) + " - " + s[2] + " " + K.currency });
    scrollToId("pdl-order");
  });

  var rt;
  window.addEventListener("resize", function () { clearTimeout(rt); rt = setTimeout(render, 120); });
  setAuto();
  render();
}

    var okN = name.length > 1, okP = digits.length >= 9;
    bad("pdl-fn-w", !okN); bad("pdl-fp-w", !okP);
    if (!okN) { show("er", O.errName); return; }
    if (!okP) { show("er", O.errPhone); return; }
    if (form.elements.website.value) { return; }
    var m = form.elements.messenger.value, comment = form.elements.comment.value.trim();
    var text = "Нове замовлення\n" + (chosen ? "Виріб: " + chosen + "\n" : "") + "Ім'я: " + name + "\nТелефон: " + phone + (comment ? "\nКоментар: " + comment : "") + "\nФото надішлю в цей чат.";

    if (O.endpoint) {
      var fd = new FormData();
      fd.append("product", chosen); fd.append("name", name); fd.append("phone", phone); fd.append("messenger", m); fd.append("comment", comment);
      if (O.sendPhoto && window.__PDL_PHOTO) { fd.append("photo", window.__PDL_PHOTO, window.__PDL_PHOTO.name); }
      subBtn.disabled = true;
      fetch(O.endpoint, { method: "POST", body: fd, headers: { "Accept": "application/json" } }).then(function (r) {
        subBtn.disabled = false;
        if (!r.ok) { throw new Error("bad"); }
        show("ok", O.okEndpoint); form.reset();
      }).catch(function () { subBtn.disabled = false; show("er", O.errSend); });
      return;
    }
    show("ok", O.okMessenger);
    if (m === "telegram") { window.open(tgUrl(text), "_blank"); }
    else if (m === "whatsapp") { window.open(waUrl(text), "_blank"); }
    else {
      try { if (navigator.clipboard) { navigator.clipboard.writeText(text); } } catch (x) {}
      var va = document.createElement("a"); va.href = B.viberUrl; va.target = "_blank"; va.rel = "noopener"; document.body.appendChild(va); va.click(); document.body.removeChild(va);
    }
  });
}

/* ---------- ЗАГАЛЬНІ ПОДІЇ ---------- */
function initGlobal() {
  var hd = $("#pdl-hd"), mm = $("#pdl-mm"), bg = $("#pdl-bg");
  function onScroll() { hd.classList.toggle("is-sc", (window.pageYOffset || document.documentElement.scrollTop) > 10); }
  window.addEventListener("scroll", onScroll, { passive: true }); onScroll();
  bg.addEventListener("click", function () {
    var open = mm.classList.toggle("open");
    bg.innerHTML = ic(open ? "close" : "menu");
  });
  root.addEventListener("click", function (e) {
    var a = e.target.closest ? e.target.closest("a[data-go]") : null;
    if (!a) { return; }
    e.preventDefault(); e.stopPropagation();
    var pick = a.getAttribute("data-pick"), prod = a.getAttribute("data-prod");
    if (mm.classList.contains("open")) { mm.classList.remove("open"); bg.innerHTML = ic("menu"); }
    if (pick) { API.pickProduct(pick); }
    else if (prod && API.setOrder) { API.setOrder({ text: prod }); }
    scrollToId(a.getAttribute("data-go"));
  }, true);
  root.addEventListener("error", function (e) {
    var t = e.target;
    if (t && t.tagName === "IMG" && !t.getAttribute("data-fb")) { t.setAttribute("data-fb", "1"); t.src = placeholder(); }
  }, true);
  var fab = $("#pdl-fab");
  if (fab) { $("#pdl-fabb").addEventListener("click", function () { fab.classList.toggle("open"); }); }
}

function applyTheme() {
  var C = CONFIG.colors, F = CONFIG.fonts, m = {
    "--p": C.primary, "--pd": C.primaryDark, "--ps": C.primarySoft, "--bt": C.buttonText, "--bt2": C.buttonTextOutline,
    "--bg": C.background, "--bga": C.backgroundAlt, "--sf": C.surface, "--tx": C.text, "--mu": C.textMuted, "--hd": C.heading,
    "--ac": C.accent, "--bd": C.border, "--dk": C.dark, "--dkt": C.darkText, "--st": C.star, "--ok": C.success, "--er": C.error,
    "--hb": C.headerBg, "--fbg": C.footerBg, "--ftx": C.footerText
  };
  for (var k in m) { if (Object.prototype.hasOwnProperty.call(m, k)) { root.style.setProperty(k, m[k]); } }
  root.style.setProperty("--fh", "'" + F.heading + "',Georgia,serif");
  root.style.setProperty("--fbd", "'" + F.body + "'" + (F.bodyFallback ? ",'" + F.bodyFallback + "'" : "") + ",Arial,sans-serif");
  root.style.setProperty("--fpr", "'" + F.price + "',Georgia,serif");
  if (F.url && !document.getElementById("pdl-fonts")) {
    var l = document.createElement("link");
    l.id = "pdl-fonts"; l.rel = "stylesheet"; l.href = F.url;
    document.head.appendChild(l);
  }
}

function start() {
  resolveAll();
  applyTheme();
  var S = CONFIG.show || {};
  function on(k) { return S[k] !== false; }
  root.innerHTML = buildHeader() + buildHero() + buildPicker() + (on("catalog") ? buildCatalog() : "") + (on("check") ? buildCheck() : "") + (on("works") ? buildWorks() : "") + (on("ba") ? buildBA() : "") + (on("quality") ? buildQuality() : "") + (on("gifts") ? buildGifts() : "") + (on("steps") ? buildSteps() : "") + (on("reviews") ? buildReviews() : "") + (on("delivery") ? buildDelivery() : "") + (on("faq") ? buildFaq() : "") + (on("cta") ? buildCta() : "") + buildOrder() + buildFooter() + buildFab();
  root.classList.add("pdl-js");
  if (!on("steps")) { var rvs = $("#pdl-reviews"); if (rvs) { rvs.classList.remove("pdl-alt"); } }
  initGlobal();
  initHeroSlider();
  if ($("#pdl-car1")) { initCar($("#pdl-car1")); }
  if ($("#pdl-car3")) { initCar($("#pdl-car3")); }
  if ($("#pdl-car2")) { initWorks(); }
  initBA();
  initFaq();
  initPicker();
  initExtra();
  initOrder();
  initCounters();
  initReveal();
}

if (document.readyState === "loading") { document.addEventListener("DOMContentLoaded", start); } else { setTimeout(start, 0); }

})();

/* ============================================================
   ЛОГІКА ПРАЙСУ. ЗАЗВИЧАЙ РЕДАГУВАТИ НЕ ПОТРІБНО
   ============================================================ */
var tries = 0;
function ic(d) { return '<svg class="pdl-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="' + d + '"/></svg>'; }
function fmt(n) {
  var s = (Math.round(n * 100) / 100).toFixed(2);
  if (s.slice(-3) === ".00") { s = s.slice(0, -3); } else if (s.slice(-1) === "0") { s = s.slice(0, -1); }
  var parts = s.split(".");
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  return parts.join(",");
}
function same(a, b) { return a !== null && b !== null && a === b; }

function build(ref) {
  var C = PRICES.colors, D = PRICES.discount;
  var sec = document.createElement("section");
  sec.className = "pdl-sec pdp-sec";
  sec.id = PRICES.sectionId;
  sec.style.setProperty("--pdp-cord", C.cord);
  sec.style.setProperty("--pdp-peg", C.peg);
  sec.style.setProperty("--pdp-paper", C.paper);
  sec.style.setProperty("--pdp-disc", C.stamp);
  sec.style.setProperty("--pdp-disct", C.stampText);

  var tabs = PRICES.groups.map(function (g, i) { return '<button type="button" class="pdl-tab' + (i === 0 ? " on" : "") + '" data-g="' + i + '">' + g.tab + "</button>"; }).join("");
  sec.innerHTML = '<div class="pdl-wrap">' +
    '<div class="pdp-top pdp-rv"><div class="pdl-head"><h2 class="pdl-h2">' + PRICES.title + '</h2><p class="pdl-sub">' + PRICES.subtitle + "</p></div>" +
    (D.percent > 0 ? '<div class="pdp-stamp">' + D.badge + "<small>" + D.badgeText + "</small></div>" : "") + "</div>" +
    '<div class="pdp-ctl pdp-rv"><div class="pdp-tabs" style="display:flex;flex-wrap:wrap;gap:10px">' + tabs + "</div>" +
    '<div class="pdp-swb"><div class="pdp-sw" id="pdp-sw"><i></i><button type="button" data-m="p" class="on">' + PRICES.modePrinter + '</button><button type="button" data-m="l">' + PRICES.modeLab + '</button></div><p class="pdp-mn" id="pdp-mn"></p></div></div>' +
    '<div class="pdp-note pdp-rv">' + ic("M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20z M12 16v-4 M12 8h.01") + '<span id="pdp-note"></span></div>' +
    '<div class="pdp-grid" id="pdp-grid"></div><p class="pdp-hint">' + PRICES.hint + "</p>" +
    '<div class="pdl-glass pdp-calc pdp-rv"><div><div class="lb">' + PRICES.calcLabel + '</div><div class="sel" id="pdp-sel"></div><div class="md" id="pdp-md"></div></div>' +
    '<div><div class="lb">' + PRICES.qtyLabel + '</div><div class="pdp-qty"><button type="button" id="pdp-m" aria-label="-">-</button><input type="number" id="pdp-q" min="1" max="99999" value="' + PRICES.qtyDefault + '"><button type="button" id="pdp-pl" aria-label="+">+</button></div></div>' +
    '<div class="pdp-tot"><div class="lb">' + PRICES.totalLabel + '</div><div class="old" id="pdp-old"></div><div class="sum" id="pdp-sum"></div><div class="ds" id="pdp-ds"></div><a href="#pdl-order" data-go="pdl-order" data-prod="" id="pdp-ord" class="pdl-btn">' + PRICES.orderBtn + "</a></div></div></div>";
  ref.parentNode.insertBefore(sec, ref.nextSibling);
  return sec;
}

function init(ref) {
  var sec = build(ref);
  var G = PRICES.groups, D = PRICES.discount;
  var gi = 0, mode = PRICES.defaultMode === "l" ? "l" : "p", si = 0, qty = Math.max(1, parseInt(PRICES.qtyDefault, 10) || 1);
  var grid = sec.querySelector("#pdp-grid"), sw = sec.querySelector("#pdp-sw"), note = sec.querySelector("#pdp-note");
  var q = sec.querySelector("#pdp-q");
  var tabEls = [].slice.call(sec.querySelectorAll(".pdp-tabs .pdl-tab"));
  var swBtns = [].slice.call(sec.querySelectorAll(".pdp-sw button"));

  function price(it, m) { return m === "p" ? it.p : it.l; }
  function other(m) { return m === "p" ? "l" : "p"; }

  function altText(it) {
    var cur = price(it, mode), oth = price(it, other(mode));
    if (cur === null) { return mode === "p" ? PRICES.onlyLab : PRICES.onlyPrinter; }
    if (oth === null) { return mode === "p" ? PRICES.onlyPrinter : PRICES.onlyLab; }
    if (same(cur, oth)) { return ""; }
    return (mode === "p" ? PRICES.altLab : PRICES.altPrinter) + " " + fmt(oth) + " " + PRICES.currency;
  }

  function renderGrid() {
    var g = G[gi];
    note.textContent = g.note;
    grid.innerHTML = g.items.map(function (it, i) {
      var r = it.w / it.h, w = r <= 1 ? r * 100 : 100, h = r <= 1 ? 100 : 100 / r;
      var rot = [-2.4, 1.8, -1.2, 2.6, -2, 1.4][i % 6];
      var cur = price(it, mode);
      var arr = (g.images && g.images.length) ? g.images : PRICES.images; var img = res(arr[i % arr.length]);
      return '<div class="pdp-card' + (i === si ? " sel" : "") + '" data-i="' + i + '" style="--r:' + rot + "deg;--d:" + (i * 90) + 'ms"><span class="pdp-peg"></span>' +
        '<div class="pdp-ph"><div class="pdp-pic' + (g.polaroid ? " pol" : "") + '" style="width:' + w.toFixed(1) + "%;height:" + h.toFixed(1) + '%"><img src="' + img + '" alt="" loading="lazy"></div></div>' +
        '<div class="pdp-sz">' + it.s + "<small>" + PRICES.sizeUnit + '</small></div><div class="pdp-pr"><b class="pdp-num">' + (cur === null ? "-" : fmt(cur)) + "</b><span>" + PRICES.unit + '</span></div><div class="pdp-alt">' + altText(it) + "</div></div>";
    }).join("");
  }

  function flipPrices() {
    var g = G[gi];
    [].slice.call(grid.querySelectorAll(".pdp-card")).forEach(function (c, i) {
      var it = g.items[parseInt(c.getAttribute("data-i"), 10)], num = c.querySelector(".pdp-num");
      var cur = price(it, mode);
      num.classList.remove("flip"); void num.offsetWidth; num.classList.add("flip");
      setTimeout(function () { num.textContent = cur === null ? "-" : fmt(cur); }, 220);
      c.querySelector(".pdp-alt").textContent = altText(it);
    });
  }

  function calc() {
    var g = G[gi], it = g.items[si], unit = price(it, mode);
    var title = g.name + " " + it.s + " " + PRICES.sizeUnit;
    sec.querySelector("#pdp-sel").textContent = title;
    sec.querySelector("#pdp-md").textContent = mode === "p" ? PRICES.modePrinter : PRICES.modeLab;
    if (unit === null) { unit = price(it, other(mode)); }
    var total = unit * qty, disc = D.percent > 0 && qty >= D.from;
    var sum = disc ? total * (1 - D.percent / 100) : total;
    var s = sec.querySelector("#pdp-sum"), newT = fmt(sum) + " " + PRICES.currency;
    if (s.textContent !== newT) { s.textContent = newT; s.classList.add("bump"); setTimeout(function () { s.classList.remove("bump"); }, 250); }
    sec.querySelector("#pdp-old").textContent = disc ? fmt(total) + " " + PRICES.currency : "";
    sec.querySelector("#pdp-ds").textContent = D.percent > 0 ? (disc ? D.activeText : D.infoText) : "";
    sec.querySelector("#pdp-ord").setAttribute("data-prod", "Фотодрук: " + title + ", " + (mode === "p" ? PRICES.modePrinter : PRICES.modeLab).toLowerCase() + ", " + qty + " шт - " + newT);
  }

  function setMode(m, animate) {
    mode = m;
    sw.classList.toggle("lab", m === "l");
    swBtns.forEach(function (b) { b.classList.toggle("on", b.getAttribute("data-m") === m); });
    var mn = sec.querySelector("#pdp-mn"), txt = m === "p" ? PRICES.modeNotePrinter : PRICES.modeNoteLab;
    if (animate) { mn.classList.add("out"); setTimeout(function () { mn.textContent = txt; mn.classList.remove("out"); }, 220); flipPrices(); } else { mn.textContent = txt; }
    calc();
  }
  function selectItem(i) {
    si = i;
    var it = G[gi].items[i];
    if (price(it, mode) === null) { setMode(other(mode), true); }
    [].slice.call(grid.querySelectorAll(".pdp-card")).forEach(function (c) { c.classList.toggle("sel", parseInt(c.getAttribute("data-i"), 10) === i); });
    calc();
  }

  tabEls.forEach(function (b) {
    b.addEventListener("click", function () {
      gi = parseInt(b.getAttribute("data-g"), 10); si = 0;
      tabEls.forEach(function (x) { x.classList.toggle("on", x === b); });
      if (price(G[gi].items[0], mode) === null) { setMode(other(mode), false); }
      renderGrid(); calc();
    });
  });
  swBtns.forEach(function (b) { b.addEventListener("click", function () { if (b.getAttribute("data-m") !== mode) { setMode(b.getAttribute("data-m"), true); } }); });
  grid.addEventListener("click", function (e) {
    var c = e.target.closest ? e.target.closest(".pdp-card") : null;
    if (c) { selectItem(parseInt(c.getAttribute("data-i"), 10)); }
  });
  function setQty(v) { qty = Math.min(99999, Math.max(1, v || 1)); q.value = qty; calc(); }
  sec.querySelector("#pdp-m").addEventListener("click", function () { setQty(qty - (qty > 100 ? 10 : 1)); });
  sec.querySelector("#pdp-pl").addEventListener("click", function () { setQty(qty + (qty >= 100 ? 10 : 1)); });
  q.addEventListener("input", function () { var v = parseInt(q.value, 10); if (v) { qty = Math.min(99999, Math.max(1, v)); calc(); } });
  q.addEventListener("change", function () { setQty(parseInt(q.value, 10)); });

  setMode(mode, false);
  renderGrid(); calc();

  var els = [].slice.call(sec.querySelectorAll(".pdp-rv"));
  if ("IntersectionObserver" in window) {
    var io = new IntersectionObserver(function (en) { en.forEach(function (e) { if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } }); }, { threshold: .12 });
    els.forEach(function (e) { io.observe(e); });
    setTimeout(function () { els.forEach(function (e) { if (e.getBoundingClientRect().top < window.innerHeight) { e.classList.add("in"); } }); }, 700);
  } else { els.forEach(function (e) { e.classList.add("in"); }); }
}

function wait() {
  var ref = document.getElementById(PRICES.insertAfter);
  if (!ref && tries > 30) { ref = document.getElementById("pdl-picker"); }
  if (ref && !document.getElementById(PRICES.sectionId)) { init(ref); return; }
  tries++;
  if (tries < 120 && !document.getElementById(PRICES.sectionId)) { setTimeout(wait, 100); }
}
wait();

})();
</script>
